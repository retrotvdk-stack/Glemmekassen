<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RetroKyllingen.dk</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body {
      background: #111;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    /* Particle canvas sits behind everything */
    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Vignette – fades edges so particles feel deep */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.72) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-size: clamp(1rem, 3vw, 1.6rem);
      letter-spacing: 0.05em;
      color: #fff;
      margin-bottom: 2rem;
    }

    .divider {
      width: clamp(200px, 50vw, 400px);
      height: 1px;
      background: rgba(255,255,255,0.15);
      margin: 0 auto 2rem;
    }

    .subtitle {
      font-size: clamp(0.5rem, 1.5vw, 0.75rem);
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
    }

    .corner { position: fixed; width: 50px; height: 50px; pointer-events: none; z-index: 10; }
    .corner svg { width: 100%; height: 100%; }
    .corner-tl { top: 1.5rem; left: 1.5rem; }
    .corner-tr { top: 1.5rem; right: 1.5rem; transform: scaleX(-1); }
    .corner-bl { bottom: 1.5rem; left: 1.5rem; transform: scaleY(-1); }
    .corner-br { bottom: 1.5rem; right: 1.5rem; transform: scale(-1,-1); }

    .footer {
      position: fixed;
      bottom: 1.2rem;
      font-size: 0.45rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      z-index: 10;
    }
  </style>
</head>
<body>

  <canvas id="c"></canvas>

  <div class="corner corner-tl"><svg viewBox="0 0 50 50" fill="none"><path d="M2 25 L2 2 L25 2" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/></svg></div>
  <div class="corner corner-tr"><svg viewBox="0 0 50 50" fill="none"><path d="M2 25 L2 2 L25 2" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/></svg></div>
  <div class="corner corner-bl"><svg viewBox="0 0 50 50" fill="none"><path d="M2 25 L2 2 L25 2" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/></svg></div>
  <div class="corner corner-br"><svg viewBox="0 0 50 50" fill="none"><path d="M2 25 L2 2 L25 2" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/></svg></div>

  <div class="card">
    <div class="logo">retrokyllingen.dk</div>
    <div class="divider"></div>
    <div class="subtitle">vi bygger siden endnu bedre</div>
  </div>

  <div class="footer">&copy; 2026 retrokyllingen.dk</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() { this.init(true); }

      init(randomY = false) {
        const tier = Math.random();
        if (tier < 0.7) {
          // fine dust – tiny, slow, very faint
          this.r   = Math.random() * 0.7 + 0.2;
          this.spd = Math.random() * 0.25 + 0.05;
          this.max = 0.35;
        } else if (tier < 0.92) {
          // mid grain
          this.r   = Math.random() * 1.1 + 0.6;
          this.spd = Math.random() * 0.4 + 0.1;
          this.max = 0.55;
        } else {
          // occasional larger fleck
          this.r   = Math.random() * 1.6 + 1.0;
          this.spd = Math.random() * 0.3 + 0.08;
          this.max = 0.22;
        }

        this.x       = Math.random() * W;
        this.y       = randomY ? Math.random() * H : H + this.r + 2;
        this.vx      = (Math.random() - 0.5) * 0.18;
        this.vy      = -(this.spd);
        this.life    = 0;
        this.maxLife = (H / this.spd) * (0.8 + Math.random() * 0.4);

        const g = Math.floor(180 + Math.random() * 75);
        this.color = `${g},${g},${g}`;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life++;
        if (this.y < -this.r - 2 || this.life > this.maxLife) this.init(false);
      }

      draw() {
        const t = this.life / this.maxLife;
        const alpha = t < 0.1
          ? (t / 0.1) * this.max
          : t > 0.85
            ? ((1 - t) / 0.15) * this.max
            : this.max;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color},${alpha.toFixed(3)})`;
        ctx.fill();
      }
    }

    function init() {
      particles = Array.from({ length: 220 }, () => new Particle());
    }

    function loop() {
      ctx.clearRect(0, 0, W, H);
      for (const p of particles) { p.update(); p.draw(); }
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => { resize(); init(); });
    resize();
    init();
    loop();
  </script>

</body>
</html>
